<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>טופס אימוץ כלבה</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Heebo', sans-serif; overflow: hidden; background-color: #f8fafc; }
        
        .slide-up { animation: slideUp 0.5s forwards cubic-bezier(0.16, 1, 0.3, 1); }
        .slide-down { animation: slideDown 0.5s forwards cubic-bezier(0.16, 1, 0.3, 1); }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .option-card {
            transition: all 0.2s;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .option-card:hover { background-color: #f0fdfa; border-color: #0d9488; }
        .option-card:active { transform: scale(0.98); }
        .option-selected { background-color: #f0fdfa; border-color: #0d9488; box-shadow: 0 0 0 1px #0d9488; }
        
        input[type="text"], input[type="tel"], textarea {
            font-size: 1.15rem;
            border: none;
            border-bottom: 2px solid #cbd5e1;
            background: transparent;
            border-radius: 0;
            padding: 0.5rem 0;
            color: #0f172a;
            -webkit-appearance: none;
            width: 100%;
        }
        @media (min-width: 768px) {
            input[type="text"], input[type="tel"], textarea { font-size: 1.5rem; }
        }
        input[type="text"]:focus, input[type="tel"]:focus, textarea:focus {
            box-shadow: none;
            border-color: #0d9488;
        }
        input::placeholder, textarea::placeholder { color: #94a3b8; }
        
        ::-webkit-scrollbar { display: none; }
        .pb-safe { padding-bottom: calc(1rem + env(safe-area-inset-bottom)); }
    </style>
</head>
<body class="h-screen flex flex-col text-slate-800">
    
    <div class="h-1 bg-slate-200 fixed top-0 w-full z-50">
        <div id="progress-bar" class="h-full bg-teal-600 transition-all duration-500 ease-out" style="width: 0%"></div>
    </div>

    <!-- Navigation Footer -->
    <div class="fixed bottom-0 left-0 w-full p-3 px-5 md:p-6 pb-safe flex justify-between items-center bg-white/95 backdrop-blur-md border-t border-slate-200 z-40 shadow-[0_-4px_20px_rgba(0,0,0,0.04)]">
        <div class="flex gap-2 md:gap-3 w-full md:w-auto">
            <button id="btn-prev" onclick="goPrev()" class="w-12 h-12 md:w-auto md:px-6 rounded-xl bg-slate-100 active:bg-slate-200 md:hover:bg-slate-200 text-slate-600 disabled:opacity-30 disabled:cursor-not-allowed flex items-center justify-center transition-colors shrink-0">
                <i data-lucide="chevron-down" class="md:mr-2"></i> <span class="hidden md:inline font-medium">חזור</span>
            </button>
            <button id="btn-next" onclick="goNext()" class="flex-1 md:flex-none h-12 px-6 rounded-xl bg-teal-600 active:bg-teal-700 md:hover:bg-teal-700 text-white disabled:opacity-30 flex items-center justify-center font-bold text-lg transition-colors shadow-sm">
                הבא <i data-lucide="chevron-up" class="mr-2 h-5 w-5"></i>
            </button>
        </div>
        <div class="text-slate-500 font-medium text-sm hidden md:block" id="progress-text"></div>
    </div>

    <div class="flex-1 flex flex-col justify-start md:justify-center items-start max-w-3xl mx-auto w-full px-5 md:px-12 pb-32 pt-16 md:pt-10 overflow-y-auto" id="question-container">
    </div>

    <script>
        const WEB3FORMS_ACCESS_KEY = 'f4bb2332-54cf-43fc-8e03-de315b37d8a7';

        const questions = [
            { id: 'welcome', type: 'info', title: 'טופס מועמדות לאימוץ 🐾', desc: 'חשוב לנו למצוא לכלבה בית חם, יציב ואוהב לטווח ארוך. תהליך זה ייקח מספר דקות, נשאל שאלה אחת בכל פעם.', buttonText: 'בואו נתחיל' },
            { id: 'q_name', type: 'text', title: '1. איך קוראים לכם?', placeholder: 'שם מלא' },
            { id: 'q_phone', type: 'tel', title: '2. מה מספר הטלפון שלכם?', placeholder: 'למשל 050-1234567' },
            { id: 'q_id', type: 'text', title: '3. מהו מספר תעודת הזהות?', placeholder: '9 ספרות' },
            { id: 'q_city', type: 'text', title: '4. באיזו עיר אתם גרים?', placeholder: 'למשל: תל אביב' },
            { id: 'q_address', type: 'text', title: '5. מהי הכתובת המלאה?', placeholder: 'רחוב ומספר בית' },
            { id: 'q_who_lives', type: 'radio', title: '6. מי מתגורר בבית?', options: ['אדם יחיד', 'זוג', 'זוג עם ילדים', 'משפחה מורחבת', 'אחר'] },
            { id: 'q_agreed', type: 'radio', title: '7. האם כל בני הבית יודעים ומסכימים לאימוץ?', options: ['כן', 'לא'] },
            { id: 'q_initiator', type: 'radio', title: '8. מי יזם את הרצון לאמץ את הכלבה?', options: ['אני', 'בן/בת הזוג', 'הילדים', 'החלטה משותפת', 'אחר'] },
            { id: 'q_past_dog', type: 'radio', title: '9. האם גידלתם בעבר כלב?', options: ['כן, כיום יש/היה לנו כלב', 'כן, בעבר', 'לא'] },
            { id: 'q_past_dog_details', type: 'text', title: 'מה קרה לכלב שגידלתם בעבר?', placeholder: 'פרטו בקצרה...', condition: (a) => a['q_past_dog'] === 'כן, בעבר' },
            { id: 'q_other_animals', type: 'radio', title: '10. האם יש כיום בעלי חיים נוספים בבית?', options: ['כן', 'לא'] },
            { id: 'q_other_animals_details', type: 'text', title: 'איזה בעלי חיים נוספים יש?', placeholder: 'למשל: 2 חתולים, ארנב...', condition: (a) => a['q_other_animals'] === 'כן' },
            { id: 'q_home_type', type: 'radio', title: '11. מהו סוג המגורים שלכם?', options: ['דירה בבניין', 'בית פרטי', 'בית עם חצר', 'אחר'] },
            { id: 'q_yard', type: 'radio', title: '12. האם יש לכם מרפסת או חצר?', options: ['כן', 'לא'] },
            { id: 'q_yard_safe', type: 'radio', title: 'האם המרפסת/חצר בטוחות וסגורות כך שהכלבה לא תצא?', options: ['כן', 'לא', 'לא רלוונטי'], condition: (a) => a['q_yard'] === 'כן' },
            { id: 'q_alone_hours', type: 'radio', title: '13. כמה שעות ביום הכלבה צפויה להישאר לבד?', options: ['כמעט לא תהיה לבד', 'עד 3 שעות', '3–6 שעות', '6–8 שעות', 'יותר מ-8 שעות'] },
            { id: 'q_where_day', type: 'text', title: '14. איפה הכלבה צפויה להיות במהלך היום?', placeholder: 'בבית, בחצר, במשרד...' },
            { id: 'q_where_sleep', type: 'text', title: '15. איפה היא צפויה לישון בלילה?', placeholder: 'במיטה, בסלון, במלונה...' },
            { id: 'q_reason', type: 'textarea', title: '16. מה הסיבה שאתם מעוניינים לאמץ דווקא אותה?', placeholder: 'שתפו אותנו במחשבותיכם...' },
            { id: 'q_age7', type: 'radio', title: '17. האם העובדה שהיא בת 7 מתאימה לכם?', options: ['בהחלט', 'כן', 'לא בטוחים', 'לא'] },
            { id: 'q_looking_for', type: 'checkbox', title: '18. מה אתם מחפשים בכלבה?', options: ['כלבה רגועה לבית', 'חברה למשפחה', 'חברה לילדים', 'לטיולים ופעילות', 'אחר'] },
            { id: 'q_important', type: 'textarea', title: '19. מה חשוב לכם במיוחד באופי של הכלבה?', placeholder: 'למשל: שתהיה שקטה, ידידותית...' },
            { id: 'q_caretaker', type: 'radio', title: '20. מי יהיה אחראי בעיקר על הטיפול היומיומי?', options: ['אני', 'בן/בת הזוג', 'שנינו', 'אחד הילדים', 'כל בני המשפחה'] },
            { id: 'q_walks', type: 'radio', title: '21. כמה טיולים ביום אתם מתכננים להוציא אותה?', options: ['1', '2', '3', '4 ומעלה'] },
            { id: 'q_adjustment', type: 'radio', title: '22. אם יהיו קשיי הסתגלות, מה תעשו?', options: ['אתן לה זמן להתרגל', 'אתייעץ עם מאלף/ת', 'אתייעץ עם וטרינר', 'אפנה אליכם לעזרה', 'אחר'] },
            { id: 'q_giveup', type: 'radio', title: '23. אם בעתיד לא תוכלו להמשיך לטפל בה, מה תעשו?', options: ['אפנה אליכם ואחזיר אליכם', 'אחפש לה משפחה אחרת', 'אפנה לעמותה', 'אחר'] },
            { id: 'q_commitments', type: 'checkbox', title: '24. התחייבויות האימוץ (חובה לסמן הכל)', options: ['מתחייב/ת שלא למכור את הכלבה.', 'מתחייב/ת שלא להרביע אותה.', 'מתחייב/ת שלא למסור לאדם אחר ללא תיאום.', 'אחזיר אליכם במקרה שלא אוכל לטפל.', 'מסכים/ה לפגישת היכרות לפני האימוץ.', 'מבין/ה שנדרש לחתום על חוזה אימוץ.'] },
            { id: 'q_home_visit', type: 'radio', title: '25. הכנת תמונות וביקור בית', desc: 'בהמשך נבקש תמונות של הבית בוואטסאפ (אפשר לארגן מראש). האם תסכימו גם לביקור בית במידת הצורך?', options: ['כן', 'לא'] },
            { id: 'q_anything_else', type: 'textarea', title: '26. יש משהו נוסף שחשוב שנדע?', placeholder: 'הבמה שלכם...' },
            { id: 'thank_you', type: 'loading', title: 'שולח נתונים...' }
        ];

        let currentIndex = 0;
        let answers = {};
        const container = document.getElementById('question-container');
        
        function getNextIndex(dir) {
            let idx = currentIndex + dir;
            while(idx > 0 && idx < questions.length - 1) {
                if(!questions[idx].condition || questions[idx].condition(answers)) {
                    return idx;
                }
                idx += dir;
            }
            return Math.max(0, Math.min(idx, questions.length - 1));
        }

        function renderQuestion(index, animDirection = 'up') {
            const q = questions[index];
            const isLast = index === questions.length - 1;
            const animClass = animDirection === 'up' ? 'slide-up' : 'slide-down';
            
            if (isLast) {
                document.getElementById('btn-prev').style.display = 'none';
                document.getElementById('btn-next').style.display = 'none';
                document.getElementById('progress-text').style.display = 'none';
                document.getElementById('progress-bar').style.width = '100%';
                
                container.innerHTML = `
                    <div class="text-center w-full max-w-lg mx-auto ${animClass} pt-10 md:pt-0">
                        <div class="w-24 h-24 md:w-28 md:h-28 bg-teal-50 text-teal-600 rounded-full flex items-center justify-center mx-auto mb-6 md:mb-8 shadow-sm">
                            <i data-lucide="loader" class="w-12 h-12 md:w-16 md:h-16 animate-spin"></i>
                        </div>
                        <h1 class="text-3xl md:text-5xl font-extrabold text-slate-900 mb-4 md:mb-6">מעבד נתונים...</h1>
                        <p class="text-lg md:text-xl text-slate-600 mb-10 px-4">הטופס נשלח ברגעים אלו, אנא המתינו.</p>
                    </div>
                `;
                lucide.createIcons();
                submitForm();
                return;
            }
            
            document.getElementById('btn-prev').disabled = index === 0;
            document.getElementById('btn-prev').style.display = 'flex';
            const btnNext = document.getElementById('btn-next');
            btnNext.style.display = (q.type === 'info') ? 'none' : 'flex';
            
            const realProgress = Math.max(0, index - 1) / (questions.length - 2) * 100;
            document.getElementById('progress-bar').style.width = index === 0 ? '0%' : `${realProgress}%`;
            document.getElementById('progress-text').innerText = index > 0 ? `${index} מתוך 26` : '';

            let html = `<div class="w-full ${animClass}">`;
            
            if (q.type === 'info') {
                html += `
                    <div class="text-center w-full max-w-lg mx-auto pt-4 md:pt-0">
                        <div class="w-20 h-20 md:w-24 md:h-24 bg-teal-100 rounded-full flex items-center justify-center mx-auto mb-6 md:mb-8 shadow-sm">
                            <span class="text-4xl md:text-5xl">🐾</span>
                        </div>
                        <h1 class="text-3xl md:text-5xl font-extrabold text-teal-900 mb-4 md:mb-6 leading-tight">${q.title}</h1>
                        <p class="text-base md:text-xl text-slate-600 mb-8 whitespace-pre-line leading-relaxed">${q.desc}</p>
                        <button onclick="goNext()" class="bg-teal-600 active:bg-teal-700 md:hover:bg-teal-700 text-white font-bold py-4 px-10 rounded-full text-xl shadow-lg transition-transform transform active:scale-95 w-full md:w-auto flex items-center justify-center gap-2 mx-auto">
                            ${q.buttonText}
                        </button>
                    </div>
                `;
            } else {
                html += `<h2 class="text-2xl md:text-4xl font-bold mb-2 md:mb-3 text-slate-900 leading-tight">${q.title}</h2>`;
                if(q.desc) html += `<p class="text-slate-500 mb-6 md:mb-8 text-base md:text-lg">${q.desc}</p>`;
                
                if (q.type === 'text' || q.type === 'tel') {
                    html += `<input type="${q.type}" id="${q.id}" class="w-full mt-2 md:mt-4 focus:outline-none" placeholder="${q.placeholder || ''}" value="${answers[q.id] || ''}" onkeydown="if(event.key==='Enter') goNext()">
                        <div class="text-sm text-teal-700 mt-4 flex items-center font-medium opacity-70 md:opacity-100"><i data-lucide="corner-down-left" class="w-4 h-4 mr-2"></i> לחצו Enter כדי להמשיך</div>`;
                } else if (q.type === 'textarea') {
                    html += `<textarea id="${q.id}" class="w-full mt-2 md:mt-4 focus:outline-none resize-none border-b-2" rows="4" placeholder="${q.placeholder || ''}">${answers[q.id] || ''}</textarea>`;
                } else if (q.type === 'radio') {
                    html += `<div class="mt-4 md:mt-6 space-y-2.5 md:space-y-3 w-full">`;
                    q.options.forEach(opt => {
                        const checked = answers[q.id] === opt ? 'checked' : '';
                        const selClass = checked ? 'option-selected' : '';
                        html += `
                            <label class="option-card border border-slate-200 rounded-2xl p-3.5 md:p-4 flex items-center ${selClass}">
                                <div class="w-6 h-6 rounded-full border-2 border-slate-300 flex items-center justify-center ml-3.5 bg-white shrink-0">
                                    <div class="w-3 h-3 rounded-full bg-teal-600 ${checked ? 'opacity-100' : 'opacity-0'}"></div>
                                </div>
                                <input type="radio" name="${q.id}" value="${opt}" class="hidden" ${checked} onchange="handleRadioChange('${q.id}', '${opt}')">
                                <span class="text-lg md:text-xl text-slate-700 font-medium leading-tight">${opt}</span>
                            </label>`;
                    });
                    html += `</div>`;
                } else if (q.type === 'checkbox') {
                    html += `<div class="mt-4 md:mt-6 space-y-2.5 md:space-y-3 w-full">`;
                    const currentAnswers = typeof answers[q.id] === 'string' ? answers[q.id].split(', ') : [];
                    q.options.forEach(opt => {
                        const checked = currentAnswers.includes(opt) ? 'checked' : '';
                        const selClass = checked ? 'option-selected' : '';
                        html += `
                            <label class="option-card border border-slate-200 rounded-2xl p-3.5 md:p-4 flex items-center ${selClass}" onclick="toggleCheckbox(this)">
                                <div class="w-6 h-6 rounded-md border-2 border-slate-300 flex items-center justify-center ml-3.5 bg-white transition-colors shrink-0 ${checked ? 'bg-teal-600 border-teal-600' : ''}">
                                    <i data-lucide="check" class="text-white w-4 h-4 ${checked ? 'opacity-100' : 'opacity-0'}"></i>
                                </div>
                                <input type="checkbox" name="${q.id}" value="${opt}" class="hidden" ${checked}>
                                <span class="text-lg md:text-xl text-slate-700 font-medium leading-tight">${opt}</span>
                            </label>`;
                    });
                    html += `</div>`;
                }
            }
            
            html += `</div>`;
            container.innerHTML = html;
            lucide.createIcons();

            setTimeout(() => {
                const input = document.getElementById(q.id);
                // Do not auto-focus on mobile
                if (input && (q.type === 'text' || q.type === 'tel' || q.type === 'textarea') && window.innerWidth > 768) {
                    input.focus();
                }
            }, 100);
        }

        function saveAnswer() {
            const q = questions[currentIndex];
            if (q.type === 'text' || q.type === 'tel' || q.type === 'textarea') {
                const el = document.getElementById(q.id);
                if (el) {
                    const val = el.value.trim();
                    if (val) answers[q.id] = val;
                    else delete answers[q.id];
                }
            } else if (q.type === 'checkbox') {
                const checked = Array.from(document.querySelectorAll(`input[name="${q.id}"]:checked`)).map(cb => cb.value);
                if(checked.length) answers[q.id] = checked.join(', ');
                else delete answers[q.id];
            }
        }

        function goNext() {
            saveAnswer();
            const q = questions[currentIndex];
            if (q.type !== 'info' && q.type !== 'checkbox' && q.type !== 'loading') {
                if (!answers[q.id]) {
                    container.children[0].style.transform = 'translateX(10px)';
                    setTimeout(() => container.children[0].style.transform = 'translateX(-10px)', 100);
                    setTimeout(() => container.children[0].style.transform = 'translateX(0)', 200);
                    return;
                }
            }
            if (currentIndex < questions.length - 1) {
                currentIndex = getNextIndex(1);
                renderQuestion(currentIndex, 'up');
            }
        }

        function goPrev() {
            if (currentIndex > 0) {
                saveAnswer();
                currentIndex = getNextIndex(-1);
                renderQuestion(currentIndex, 'down');
            }
        }

        window.handleRadioChange = function(qId, val) {
            answers[qId] = val;
            setTimeout(() => goNext(), 350);
        }

        window.toggleCheckbox = function(label) {
            const checkbox = label.querySelector('input');
            const checkIcon = label.querySelector('.lucide-check');
            const box = label.querySelector('.w-6.h-6');
            checkbox.checked = !checkbox.checked;
            if(checkbox.checked) {
                label.classList.add('option-selected');
                box.classList.add('bg-teal-600', 'border-teal-600');
                checkIcon.classList.remove('opacity-0');
            } else {
                label.classList.remove('option-selected');
                box.classList.remove('bg-teal-600', 'border-teal-600');
                checkIcon.classList.add('opacity-0');
            }
        }

        async function submitForm() {
            const payload = {
                access_key: WEB3FORMS_ACCESS_KEY,
                subject: 'בקשת אימוץ חדשה: ' + (answers.q_name || 'ללא שם'),
                from_name: answers.q_name || 'טופס אימוץ'
            };

            const hebrewNames = {
                q_name: 'שם מלא', q_phone: 'טלפון', q_id: 'תעודת זהות',
                q_city: 'עיר', q_address: 'כתובת', q_who_lives: 'מי מתגורר בבית',
                q_agreed: 'כולם מסכימים', q_initiator: 'מי יזם', q_past_dog: 'גידלו כלב',
                q_past_dog_details: 'פירוט כלב', q_other_animals: 'חיות נוספות',
                q_other_animals_details: 'פירוט חיות', q_home_type: 'סוג מגורים',
                q_yard: 'מרפסת/חצר', q_yard_safe: 'בטיחות חצר', q_alone_hours: 'שעות לבד ביום',
                q_where_day: 'איפה ביום', q_where_sleep: 'איפה בלילה', q_reason: 'סיבת אימוץ',
                q_age7: 'התאמה לגיל 7', q_looking_for: 'מה מחפשים בכלבה', q_important: 'אופי חשוב',
                q_caretaker: 'אחראי טיפול', q_walks: 'טיולים ביום', q_adjustment: 'התמודדות עם קשיים',
                q_giveup: 'במקרה ויתור', q_commitments: 'התחייבויות חתומות',
                q_home_visit: 'מסכימים לביקור בית', q_anything_else: 'מידע נוסף'
            };

            for (const key in answers) {
                const label = hebrewNames[key] || key;
                payload[label] = answers[key];
            }

            try {
                const response = await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                if (response.status === 200) {
                    container.innerHTML = `
                        <div class="text-center w-full max-w-lg mx-auto slide-up pt-10 md:pt-0">
                            <div class="w-24 h-24 md:w-28 md:h-28 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6 md:mb-8 shadow-sm">
                                <i data-lucide="check-circle" class="w-12 h-12 md:w-16 md:h-16"></i>
                            </div>
                            <h1 class="text-3xl md:text-5xl font-extrabold text-slate-900 mb-4 md:mb-6">נשלח בהצלחה!</h1>
                            <p class="text-lg md:text-xl text-slate-600 mb-10 px-4">תודה רבה! הטופס שלך התקבל וניצור איתך קשר בהקדם.</p>
                        </div>
                    `;
                    lucide.createIcons();
                } else {
                    showError(result.message);
                }
            } catch (error) {
                showError('שגיאת תקשורת. בדקו את החיבור לאינטרנט ונסו שוב.');
            }
        }
        
        function showError(msg) {
            container.innerHTML = `
                <div class="text-center w-full max-w-lg mx-auto slide-up pt-10 md:pt-0">
                    <div class="w-24 h-24 md:w-28 md:h-28 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6 md:mb-8 shadow-sm">
                        <i data-lucide="x-circle" class="w-12 h-12 md:w-16 md:h-16"></i>
                    </div>
                    <h1 class="text-3xl md:text-5xl font-extrabold text-slate-900 mb-4 md:mb-6">אירעה שגיאה</h1>
                    <p class="text-lg md:text-xl text-slate-600 mb-10 px-4">${msg}</p>
                    <button onclick="submitForm()" class="bg-teal-600 active:bg-teal-700 md:hover:bg-teal-700 text-white font-bold py-4 px-12 rounded-full text-xl shadow-lg transition-transform transform active:scale-95">
                        נסה לשלוח שוב
                    </button>
                </div>
            `;
            lucide.createIcons();
        }

        renderQuestion(0);
    </script>
</body>
</html>
